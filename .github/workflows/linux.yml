name: Linux portable
on:
  push:
    branches: [main]
    paths: ['NEXUS/**', 'NEXUS-Android/package*.json', '.github/workflows/linux.yml']
  pull_request:
    paths: ['NEXUS/**', 'NEXUS-Android/package*.json', '.github/workflows/linux.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true
jobs:
  appimage:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: NEXUS
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: NEXUS/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y libsecret-1-0 libfuse2 libgtk-3-0 libnss3 libgbm1 libasound2 xvfb dbus-x11
      - run: npm ci
      - run: npm ci --prefix ../NEXUS-Android --ignore-scripts
      - run: npm run typecheck && npm run lint && npm test
      - run: npm run dist:linux
      - name: Check the packaged application with its real Linux SQLite module
        run: |
          cd release
          chmod +x NEXUS-*-linux-x64.AppImage
          ./NEXUS-*-linux-x64.AppImage --appimage-extract > /dev/null
          sudo chown root:root squashfs-root/chrome-sandbox
          sudo chmod 4755 squashfs-root/chrome-sandbox
          cd ..
          dbus-run-session -- xvfb-run -a node scripts/smoke-linux.mjs
      - name: Checksums
        run: cd release && sha256sum NEXUS-*-linux-x64.AppImage > SHA256SUMS-Linux.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nexus-linux-x64
          path: |
            NEXUS/release/*.AppImage
            NEXUS/release/SHA256SUMS-Linux.txt
          retention-days: 14
